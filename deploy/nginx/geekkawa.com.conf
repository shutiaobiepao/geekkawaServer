# 复制到 ECS：/etc/nginx/conf.d/geekkawa.com.conf
# 证书路径按阿里云 / certbot 实际文件修改后：nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name geekkawa.com www.geekkawa.com;
    return 301 https://geekkawa.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name geekkawa.com www.geekkawa.com;

    ssl_certificate     /etc/nginx/ssl/geekkawa.com.pem;
    ssl_certificate_key /etc/nginx/ssl/geekkawa.com.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
